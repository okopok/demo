<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Контакты — {{brand}}</title>
  <meta name="description" content="{{contact.subtitle}}">
  <link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">{{brand}}</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav"
            aria-controls="main-nav" aria-expanded="false" aria-label="Меню">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="main-nav">
      <ul class="navbar-nav ms-auto gap-lg-3">
        <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
        <li class="nav-item"><a class="nav-link" href="pricing.html">Тарифы</a></li>
        <li class="nav-item"><a class="nav-link active" href="contact.html">Контакты</a></li>
      </ul>
      <a class="btn btn-accent ms-lg-4 mt-3 mt-lg-0" href="contact.html">{{hero.cta}}</a>
    </div>
  </div>
</nav>

<header class="hero pb-4">
  <div class="container">
    <p class="kicker mb-3">{{contact.subtitle}}</p>
    <h1 class="display-5 fw-semibold mb-3">{{contact.title}}</h1>
  </div>
</header>

<section class="pb-5">
  <div class="container">
    <div class="row g-4">
      <div class="col-lg-5">
        <div class="card-soft h-100 p-4">
          <div class="kicker mb-3">Контакты</div>
          <div class="mb-3">
            <div class="text-secondary small mb-1">Телефон</div>
            <a class="fs-5 text-decoration-none" href="tel:{{phone}}">{{phone}}</a>
          </div>
          <div class="mb-3">
            <div class="text-secondary small mb-1">Email</div>
            <a class="fs-5 text-decoration-none" href="mailto:{{email}}">{{email}}</a>
          </div>
          <div class="mb-3">
            <div class="text-secondary small mb-1">Telegram</div>
            <div class="fs-5">{{telegram}}</div>
          </div>
          <div>
            <div class="text-secondary small mb-1">Офис</div>
            <div>{{address}}</div>
          </div>
        </div>
      </div>
      <div class="col-lg-7">
        <form id="lead-form" class="card-soft p-4" novalidate>
          <div class="mb-3">
            <label class="form-label" for="name">{{contact.form_name}}</label>
            <input class="form-control" id="name" name="name" type="text" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="contact">{{contact.form_email}}</label>
            <input class="form-control" id="contact" name="contact" type="text" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="message">{{contact.form_message}}</label>
            <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
          </div>
          <button class="btn btn-accent btn-lg px-4" type="submit">{{contact.form_submit}}</button>
          <p class="text-secondary small mt-3 mb-0">{{contact.form_note}}</p>
        </form>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="container d-flex flex-wrap justify-content-between gap-3">
    <div>{{brand}} · {{footer_note}}</div>
    <div class="d-flex flex-wrap gap-3">
      <a href="tel:{{phone}}">{{phone}}</a>
      <a href="mailto:{{email}}">{{email}}</a>
      <span>{{telegram}}</span>
    </div>
  </div>
</footer>

<script src="assets/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
